# Optional: a local Postgres for development.  docker compose up -d
# Then set DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/giantability in .env
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: giantability
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
